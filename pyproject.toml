[project]
name = "deadline-radar"
version = "0.1.0"
description = "A task manager that predicts missed deadlines and builds a rescue plan."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
